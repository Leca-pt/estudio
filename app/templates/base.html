{% import "_icons.html" as i -%}
<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Estúdio{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0e0f11">
  <link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Estúdio">
  <meta name="htmx-config" content='{"scrollIntoViewOnBoost":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"4..","swap":true,"error":false},{"code":"...","swap":false,"error":true}]}'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/static/css/estudio.css?v=13">
  <link rel="stylesheet" href="/static/css/app.css?v=111">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/vendor/idiomorph/idiomorph-ext.min.js" defer></script>
  <script src="/static/js/app.js?v=104" defer></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</head>
<body hx-boost="true" hx-ext="morph" hx-swap="morph:innerHTML">
<div class="app {% block app_class %}{% endblock %}" hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
<script>try{var a=document.currentScript.parentElement;if(localStorage.getItem('estudio-theme')==='light')a.classList.add('light');if(localStorage.getItem('estudio-side')==='collapsed')a.classList.add('side-collapsed');if(localStorage.getItem('estudio-asst')==='collapsed')a.classList.add('asst-collapsed')}catch(e){}</script>
{% block app %}
<div class="shell">
  {% include "_topbar.html" %}
  <div class="body {% block body_class %}solo{% endblock %}">
    {% block body %}{% endblock %}
  </div>
</div>
{% endblock %}
{% include "_confirm.html" %}
{% include "_lightbox.html" %}
</div>
</body>
</html>
