<div class="f"><label for="current_password">Palavra-passe atual</label><input id="current_password" class="in auth-in" type="password" name="current_password" autocomplete="current-password" required></div>
<div class="f"><label for="new_password">Nova palavra-passe</label><input id="new_password" class="in auth-in" type="password" name="new_password" autocomplete="new-password" minlength="12" required><span class="hint">Mínimo de 12 caracteres.</span></div>
<div class="f"><label for="confirm_password">Repetir nova palavra-passe</label><input id="confirm_password" class="in auth-in" type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></div>
